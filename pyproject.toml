[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-desk"
version = "1.0.0"
description = "Meridian - an agentic portfolio desk: cloud harness, MCP, programmatic tool calling and a sandbox"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "celery[redis]>=5.4", "redis>=5", "httpx>=0.27", "yfinance>=0.2.40",
  "pandas>=2.2", "numpy>=1.26", "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["meridian*"]

[tool.setuptools.package-data]
meridian = ["sandbox/runner.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 170
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E701", "E702", "E731", "E741", "B008", "B904", "B905", "E401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]   # data tables and SVG generators
"meridian/harness/planner.py" = ["E501"]   # PTC program templates are Python-in-strings
"meridian/harness/agents.py" = ["E501"]
