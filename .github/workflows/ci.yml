name: ci
on:
  pull_request:
  push: {branches: [main]}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --maxfail=3
        env: {MERIDIAN_PROVIDER: synthetic}

  celery-integration:           # real Redis broker + real worker process
    runs-on: ubuntu-latest
    needs: lint-test
    services:
      redis: {image: "redis:7-alpine", ports: ["6379:6379"]}
    env: {MERIDIAN_PROVIDER: synthetic, MERIDIAN_JOBS: celery, REDIS_URL: "redis://localhost:6379/0", MERIDIAN_DATA_DIR: /tmp/mer}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e .
      - run: celery -A meridian.jobs.tasks worker -l warning -c 2 &
      - run: sleep 5 && python scripts/smoke_celery.py

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t meridian-app .
      - run: docker build -f infra/sandbox.Dockerfile -t meridian-sandbox .
      - name: sandbox isolation smoke test (no network, read-only fs)
        run: |
          echo '{"init":{"code":"result({\"ok\":1})","tools":[],"limits":{}}}' | docker run --rm -i --network none --read-only meridian-sandbox python -I /sandbox/runner.py | grep '"done"'
